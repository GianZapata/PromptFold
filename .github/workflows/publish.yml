name: Publish Extension

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: 24.x

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the tag to point at main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not contained in origin/main."
            exit 1
          fi
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run compile
      - run: npm run test:unit
      - run: npx --no-install vsce package --out promptfold.vsix
      - name: Record SHA-256
        run: sha256sum promptfold.vsix | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload VSIX
        uses: actions/upload-artifact@v6
        with:
          name: promptfold-vsix
          path: promptfold.vsix
          if-no-files-found: error

  smoke:
    name: Smoke the packaged VSIX (${{ matrix.vscode }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, minimum]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Download VSIX
        uses: actions/download-artifact@v7
        with:
          name: promptfold-vsix
      - name: Smoke test
        run: xvfb-run -a npm run test:smoke -- promptfold.vsix ${{ matrix.vscode }}

  publish:
    name: Publish the packaged VSIX
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - name: Download VSIX
        uses: actions/download-artifact@v7
        with:
          name: promptfold-vsix
      - name: Check which publish tokens exist
        id: secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "vsce=true" >> "$GITHUB_OUTPUT"
          else
            echo "vsce=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$OVSX_PAT" ]; then
            echo "ovsx=true" >> "$GITHUB_OUTPUT"
          else
            echo "ovsx=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to the Visual Studio Marketplace
        if: steps.secrets.outputs.vsce == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath promptfold.vsix -p "$VSCE_PAT"
      - name: Skip the Visual Studio Marketplace
        if: steps.secrets.outputs.vsce == 'false'
        run: echo "::warning::VSCE_PAT is not set, so nothing was published to the Visual Studio Marketplace."
      - name: Publish to Open VSX
        if: steps.secrets.outputs.ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish promptfold.vsix -p "$OVSX_PAT"
      - name: Skip Open VSX
        if: steps.secrets.outputs.ovsx == 'false'
        run: echo "::warning::OVSX_PAT is not set, so nothing was published to Open VSX."
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; print; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9]/ { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" promptfold.vsix \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
